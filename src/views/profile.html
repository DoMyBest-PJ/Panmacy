<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — Panmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<header class="navbar">
  <div class="container navbar__inner">
    <a href="index.html" class="pm-logo">
      <svg class="pm-logo__mark" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="#1D7A63"/><path d="M16 9v14M9 16h14" stroke="#FDFBF6" stroke-width="3.4" stroke-linecap="round"/><circle cx="23.5" cy="8.5" r="3" fill="#DB8B2C"/></svg>
      <span class="pm-logo__word">Panmacy</span>
    </a>
    <button class="navbar__menu-toggle" data-nav-toggle aria-expanded="false" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <nav class="navbar__links" data-nav-drawer aria-label="Main menu">
      <a href="index.html" class="navbar__link">Browse Products</a>
      <a href="forum.html" class="navbar__link">Health Forum</a>
      <a href="chat.html" class="navbar__link">Pharmacist Chat</a>
    </nav>
    <div class="navbar__actions">
      <a href="cart.html" class="navbar__icon-btn" aria-label="Shopping Cart">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M3 4h1.6L6 12.5a1.5 1.5 0 001.5 1.2h6a1.5 1.5 0 001.5-1.2L16 6.5H5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="16" r="1.1" fill="currentColor"/><circle cx="13.5" cy="16" r="1.1" fill="currentColor"/></svg>
        <span class="navbar__badge" data-cart-badge>0</span>
      </a>
      <div class="navbar__profile">
        <button type="button" class="navbar__avatar" data-profile-toggle aria-expanded="false" aria-label="My Account" aria-haspopup="true">N</button>
        <div class="dropdown-menu" data-profile-menu role="menu">
          <div class="dropdown-menu__header">
            <div class="dropdown-menu__name">Nattawat S.</div>
            <div class="dropdown-menu__email">nattawat@email.com</div>
          </div>
          <a href="profile.html" class="dropdown-item" role="menuitem">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Profile
          </a>
          <a href="orders.html" class="dropdown-item" role="menuitem">
            <svg viewBox="0 0 16 16" fill="none"><path d="M2 4h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V4zM5 4V3a3 3 0 016 0v1" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            View Orders
          </a>
          <div class="dropdown-submenu">
            <button type="button" class="dropdown-item dropdown-submenu__toggle" data-submenu-toggle role="menuitem">
              <svg viewBox="0 0 16 16" fill="none"><path d="M2 6l1-3h10l1 3M2 6v7a1 1 0 001 1h10a1 1 0 001-1V6M2 6h12" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
              Pharmacy
            </button>
            <div class="dropdown-submenu__list">
              <a href="pharmacy-signup.html" class="dropdown-item" role="menuitem">Sign up (if not owned)</a>
              <a href="pharmacy-dashboard.html" class="dropdown-item" role="menuitem">View owned shop</a>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <a href="login.html" class="dropdown-item dropdown-item--danger" role="menuitem">
            <svg viewBox="0 0 16 16" fill="none"><path d="M6 3H3.5A1.5 1.5 0 002 4.5v7A1.5 1.5 0 003.5 13H6M10 11l3-3-3-3M13 8H6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Sign out
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container" style="padding:var(--sp-10) var(--sp-4);max-width:640px">
  <h1 style="font-family:var(--font-display);font-size:var(--fs-h2);margin-bottom:var(--sp-6)">My Profile</h1>
  <div class="panel">
    <div class="panel__body">
      <form id="profile-form" style="display:grid;gap:16px">
        <div class="field">
          <label class="field__label" for="pf-name">Full name</label>
          <input type="text" id="pf-name" class="input" value="Nattawat Srisuk">
        </div>
        <div class="field">
          <label class="field__label" for="pf-email">Email</label>
          <input type="email" id="pf-email" class="input" value="nattawat@email.com">
        </div>
        <div class="field">
          <label class="field__label" for="pf-phone">Phone</label>
          <input type="tel" id="pf-phone" class="input" value="081-234-5678">
        </div>
        <div class="field">
          <label class="field__label" for="pf-address">Default address</label>
          <input type="text" id="pf-address" class="input" value="42 Soi Sukhumvit 21, Bangkok">
        </div>
        <button type="submit" class="btn btn--primary" style="justify-self:start">Save changes</button>
      </form>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script>
document.getElementById('profile-form').addEventListener('submit', (e) => {
  e.preventDefault();
  pmToast('Profile updated');
});
</script>
</body>
</html>
